    stroke-width="1.8"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Heartbeat pulse -->
  <polyline
    points="10,16.5 12.5,16.5 14,13 15.5,19.5 17,11.5 18.5,16.5 20,16.5 22,16.5"
    stroke="url(#fav-pulse)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <circle cx="16" cy="9.2" r="1.5" fill="#dfb65c" />
