services:
  postgres:
    image: postgres:15-alpine
    container_name: civic-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civic-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      INCIDENT_VISIBILITY_RADIUS_KM: ${INCIDENT_VISIBILITY_RADIUS_KM:-25.0}
      ENABLE_EMAIL_NOTIFICATIONS: "true"
      SQL_ECHO: "false"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AI_SERVICE_URL: http://ai-service:8001
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    container_name: civic-ai-service
    environment:
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      ROBOFLOW_MODEL_ID: ${ROBOFLOW_MODEL_ID:-potholes-scbcq/1}
      ROBOFLOW_GARBAGE_MODEL_ID: ${ROBOFLOW_GARBAGE_MODEL_ID:-garbage-d6vgh/1}
      ROBOFLOW_API_URL: ${ROBOFLOW_API_URL:-https://serverless.roboflow.com}
      ROBOFLOW_HUMAN_MODEL_ID: ${ROBOFLOW_HUMAN_MODEL_ID:-humans-v0nq1/1}
      ROBOFLOW_CAR_MODEL_ID: ${ROBOFLOW_CAR_MODEL_ID:-cars-blxk2/2}
      ROBOFLOW_POTHOLE_KW_MODEL_ID: ${ROBOFLOW_POTHOLE_KW_MODEL_ID:-kuwait-potholes/1}
      ROBOFLOW_POTHOLE_ALT_MODEL_ID: ${ROBOFLOW_POTHOLE_ALT_MODEL_ID:-potholes-detection-j3w8s/1}
      # Each kind is one billed hosted call per frame; trim to cut spend.
      ROBOFLOW_SCAN_KINDS: ${ROBOFLOW_SCAN_KINDS:-road,garbage,human,car,pothole_kw,pothole_alt}
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civic-frontend
    ports:
      - "3005:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
